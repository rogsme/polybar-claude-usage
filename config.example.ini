# polybar-claude-usage settings
#
# Copy this file to ~/.config/polybar-claude-usage/config.ini and uncomment what you want to
# change. Every value below is the default. The module re-reads this file every minute, and right
# away when you right-click it.
#
# The polybar module:
#
#   [module/claude-usage]
#   type = custom/script
#   exec = ~/.local/bin/polybar-claude-usage
#   tail = true
#   click-left = ~/.local/bin/polybar-claude-usage --notify
#   click-right = kill -USR1 %pid%

[display]
# How each limit looks: pie (◔ 5 29%), text (5 29%) or bar (5 ▰▰▰▱▱▱▱▱▱▱ 29%).
# icon shows a single glyph for all of them, coloured by the limit closest to running out;
# click it for the details.
# style = pie

# Which limits to show. "auto" shows the 5-hour session (5), the weekly limit (W) and any
# per-model limit in use (S for Sonnet, O for Opus, F for Fable, + for extra usage). A list
# such as 5,W shows only those.
# meters = auto

# Put text between limits, or before them all. Use quotes to keep spaces.
# separator = "  "
# prefix =

# Show the label (5, W, …) and the percentage.
# show_label = true
# show_percent = true

# The pie style picks one of these glyphs, empty to full. Your polybar font needs them;
# Noto Sans Symbols 2 and DejaVu Sans have the defaults.
# pie_glyphs = ○◔◑◕●

# The icon style's glyph. Empty uses the pie glyph of the limit closest to running out, so the
# icon fills up as that limit does. Set any character your font has to keep it fixed.
# If an emoji font draws it (✳ is also an emoji), it can't change colour; pick the font with
# polybar's tag, numbered from 1, so font-6 is T7: icon = %{T7}✳%{T-}
# icon =

# The bar style draws bar_width cells using the filled and empty character.
# bar_width = 10
# bar_chars = ▰▱

# Colours by how close a limit is: normal (under 70%), elevated and critical (90% and over),
# following Claude's own reading when it gives one. An empty colour keeps the bar's foreground;
# try #75d85a for green. Stale numbers (no update for 15 minutes or 3 intervals) are drawn in
# color_stale.
# color_normal =
# color_elevated = #ff9500
# color_critical = #ff3b30
# color_stale = #888888

# How reset times show in the notification (strftime format).
# time_format = %H:%M

[claude]
# The claude executable. Empty searches PATH, then ~/.local/bin and other usual places.
# path =

# Seconds between checks (at least 15). Checks back off when Claude limits them.
# interval = 300

# Seconds to wait for Claude Code to answer.
# timeout = 90
